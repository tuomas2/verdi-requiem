name: Julkaise sivusto

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Rinnakkaiset julkaisut peruisivat toisensa kesken; jonotetaan sen sijaan.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Testit ovat oma workflow, jotta ne ajetaan myös muissa haaroissa ja
  # jotta punainen rasti kertoo mikä hajosi. Julkaisu odottaa niitä:
  # vanhentunut LUOTETTAVUUS.md on testi, ja se on nimenomaan lupaus
  # sivuston lukijalle.
  testit:
    uses: ./.github/workflows/testit.yml

  rakenna:
    needs: testit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Sivuston rakennus on puhdasta vakiokirjastoa: ei mutoolia eikä
      # MuseScorea. Mitattu ajamalla sivusto.py ilman kumpaakaan.
      - name: Rakenna sivusto
        run: python3 sivusto.py _sivusto

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sivusto

  # Julkaisu odottaa siihen asti kunnes repo on julkinen ja Pages on kytketty
  # päälle (Settings > Pages > Source: GitHub Actions). Privaatissa reposssa
  # deploy-pages kaatuisi virheeseen "Not Found", eikä pysyvästi punainen CI
  # kerro mitään hyödyllistä. Ehto katsoo näkyvyyttä, joten mitään ei tarvitse
  # muistaa kytkeä täältä päälle: julkaisu alkaa toimia itsestään.
  julkaise:
    needs: rakenna
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
